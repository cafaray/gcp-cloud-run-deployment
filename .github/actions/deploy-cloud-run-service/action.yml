name: "Deploy Cloud Run Service"
description: "Deploys or updates a container service on Google Cloud Run with environment variables and Secret Manager integrations"

inputs:
  service_name:
    description: "Name of the Cloud Run service"
    required: true
  image:
    description: "Full container image URI to deploy"
    required: true
  project_id:
    description: "Google Cloud Project ID"
    required: true
  region:
    description: "GCP Region (e.g. europe-southwest1)"
    required: false
    default: "europe-southwest1"
  cpu:
    description: "Number of vCPUs (e.g. 1, 2)"
    required: false
    default: "1"
  memory:
    description: "Memory limit (e.g. 512Mi, 1Gi)"
    required: false
    default: "512Mi"
  port:
    description: "Container port"
    required: false
    default: "8080"
  timeout:
    description: "Request timeout in seconds"
    required: false
    default: "300"
  min_instances:
    description: "Minimum number of container instances"
    required: false
    default: "0"
  max_instances:
    description: "Maximum number of container instances"
    required: false
    default: "10"
  allow_unauthenticated:
    description: "Allow unauthenticated invocations"
    required: false
    default: "true"
  execution_environment:
    description: "Cloud Run execution environment (gen1 or gen2)"
    required: false
    default: "gen2"
  ingress:
    description: "Ingress traffic settings (all, internal, internal-and-cloud-load-balancing)"
    required: false
    default: "all"
  service_account:
    description: "Service Account to run the service as"
    required: false
    default: ""
  env_vars:
    description: "Multiline or comma-separated list of environment variables (KEY=VALUE)"
    required: false
    default: ""
  secrets:
    description: "Multiline or comma-separated list of secrets (ENV_VAR=SECRET_NAME:VERSION or /mount/path=SECRET_NAME:VERSION)"
    required: false
    default: ""

outputs:
  service_url:
    description: "Public URL of the deployed Cloud Run service"
    value: "${{ steps.deploy.outputs.service_url }}"

runs:
  using: "composite"
  steps:
    - name: Deploy to Cloud Run
      id: deploy
      shell: bash
      run: |
        set -euo pipefail

        echo "::group::Deploying Cloud Run service: ${{ inputs.service_name }}"

        DEPLOY_ARGS=(
          run deploy "${{ inputs.service_name }}"
          --image="${{ inputs.image }}"
          --project="${{ inputs.project_id }}"
          --region="${{ inputs.region }}"
          --platform=managed
          --cpu="${{ inputs.cpu }}"
          --memory="${{ inputs.memory }}"
          --port="${{ inputs.port }}"
          --timeout="${{ inputs.timeout }}"
          --min-instances="${{ inputs.min_instances }}"
          --max-instances="${{ inputs.max_instances }}"
          --execution-environment="${{ inputs.execution_environment }}"
          --ingress="${{ inputs.ingress }}"
        )

        if [ "${{ inputs.allow_unauthenticated }}" = "true" ]; then
          DEPLOY_ARGS+=(--allow-unauthenticated)
        else
          DEPLOY_ARGS+=(--no-allow-unauthenticated)
        fi

        if [ -n "${{ inputs.service_account }}" ]; then
          DEPLOY_ARGS+=(--service-account="${{ inputs.service_account }}")
        fi

        # Process environment variables
        if [ -n "${{ inputs.env_vars }}" ]; then
          ENV_LIST=""
          while IFS= read -r line || [ -n "$line" ]; do
            # Trim whitespace
            line=$(echo "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            [[ -z "$line" || "$line" =~ ^# ]] && continue
            if [ -z "$ENV_LIST" ]; then
              ENV_LIST="$line"
            else
              ENV_LIST="${ENV_LIST},${line}"
            fi
          done <<< "${{ inputs.env_vars }}"

          if [ -n "$ENV_LIST" ]; then
            DEPLOY_ARGS+=(--set-env-vars="$ENV_LIST")
          fi
        fi

        # Process secrets
        if [ -n "${{ inputs.secrets }}" ]; then
          SECRET_LIST=""
          while IFS= read -r line || [ -n "$line" ]; do
            line=$(echo "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            [[ -z "$line" || "$line" =~ ^# ]] && continue
            if [ -z "$SECRET_LIST" ]; then
              SECRET_LIST="$line"
            else
              SECRET_LIST="${SECRET_LIST},${line}"
            fi
          done <<< "${{ inputs.secrets }}"

          if [ -n "$SECRET_LIST" ]; then
            DEPLOY_ARGS+=(--set-secrets="$SECRET_LIST")
          fi
        fi

        gcloud "${DEPLOY_ARGS[@]}"

        SERVICE_URL=$(gcloud run services describe "${{ inputs.service_name }}" \
          --project="${{ inputs.project_id }}" \
          --region="${{ inputs.region }}" \
          --format='value(status.url)')

        echo "service_url=${SERVICE_URL}" >> $GITHUB_OUTPUT
        echo "Successfully deployed ${{ inputs.service_name }} -> ${SERVICE_URL}"
        echo "::endgroup::"
