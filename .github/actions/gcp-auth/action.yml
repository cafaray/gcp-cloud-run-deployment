name: "GCP Authentication & Docker Setup"
description: "Authenticates to Google Cloud via Workload Identity Federation or Service Account Key and configures Docker for Artifact Registry"

inputs:
  project_id:
    description: "Google Cloud Project ID"
    required: true
  workload_identity_provider:
    description: "Workload Identity Provider resource ID (for OIDC auth)"
    required: false
    default: ""
  service_account:
    description: "Service Account email to impersonate (for OIDC auth)"
    required: false
    default: ""
  credentials_json:
    description: "Service Account JSON Key content (fallback auth)"
    required: false
    default: ""
  region:
    description: "Artifact Registry region for Docker authentication"
    required: false
    default: "europe-southwest1"

runs:
  using: "composite"
  steps:
    - name: Validate Authentication Inputs
      shell: bash
      run: |
        if [ -z "${{ inputs.workload_identity_provider }}" ] && [ -z "${{ inputs.credentials_json }}" ]; then
          echo "::error::Either 'workload_identity_provider' or 'credentials_json' must be provided for GCP authentication."
          exit 1
        fi

    - name: Authenticate to Google Cloud (OIDC / WIF)
      if: ${{ inputs.workload_identity_provider != '' && inputs.service_account != '' }}
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        service_account: ${{ inputs.service_account }}
        project_id: ${{ inputs.project_id }}

    - name: Authenticate to Google Cloud (Service Account Key)
      if: ${{ inputs.credentials_json != '' && inputs.workload_identity_provider == '' }}
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ inputs.credentials_json }}
        project_id: ${{ inputs.project_id }}

    - name: Set up Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker Authentication for Artifact Registry
      shell: bash
      run: |
        gcloud config set project "${{ inputs.project_id }}" --quiet
        gcloud auth configure-docker "${{ inputs.region }}-docker.pkg.dev" --quiet
