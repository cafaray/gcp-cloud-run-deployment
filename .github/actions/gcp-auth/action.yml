name: "GCP Authentication & Docker Setup"
description: "Authenticates to Google Cloud with a Service Account Key and configures Docker for Artifact Registry"

inputs:
  project_id:
    description: "Google Cloud Project ID"
    required: true
  credentials_json:
    description: "Service Account JSON Key content"
    required: true
  region:
    description: "Artifact Registry region for Docker authentication"
    required: false
    default: "europe-southwest1"

runs:
  using: "composite"
  steps:
    - name: Authenticate to Google Cloud (Service Account Key)
      uses: google-github-actions/auth@v2
      with:
        credentials_json: ${{ inputs.credentials_json }}
        project_id: ${{ inputs.project_id }}

    - name: Set up Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    - name: Configure Docker Authentication for Artifact Registry
      shell: bash
      run: |
        gcloud config set project "${{ inputs.project_id }}" --quiet
        gcloud auth configure-docker "${{ inputs.region }}-docker.pkg.dev" --quiet
