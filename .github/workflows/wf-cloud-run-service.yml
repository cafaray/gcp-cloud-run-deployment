name: "Reusable Workflow: Deploy Cloud Run Service"

on:
  workflow_call:
    inputs:
      project_id:
        description: "Google Cloud Project ID"
        required: true
        type: string
      service_name:
        description: "Name of the Cloud Run service"
        required: true
        type: string
      region:
        description: "GCP deployment region"
        required: false
        type: string
        default: "europe-southwest1"
      repository:
        description: "Artifact Registry repository name"
        required: false
        type: string
        default: "services"
      image_name:
        description: "Custom image name in Artifact Registry (defaults to region-docker.pkg.dev/project/repo/service)"
        required: false
        type: string
        default: ""
      image_tag:
        description: "Image tag to build/deploy (defaults to github.sha)"
        required: false
        type: string
        default: ""
      skip_build:
        description: "Skip image build and deploy existing image"
        required: false
        type: boolean
        default: false
      context:
        description: "Docker build context"
        required: false
        type: string
        default: "."
      dockerfile:
        description: "Path to Dockerfile"
        required: false
        type: string
        default: "Dockerfile"
      build_args:
        description: "Build arguments for Docker"
        required: false
        type: string
        default: ""
      cpu:
        description: "vCPU count"
        required: false
        type: string
        default: "1"
      memory:
        description: "Memory limit"
        required: false
        type: string
        default: "512Mi"
      port:
        description: "Port exposed by the container"
        required: false
        type: string
        default: "8080"
      timeout:
        description: "Request timeout in seconds"
        required: false
        type: string
        default: "300"
      min_instances:
        description: "Minimum container instances"
        required: false
        type: string
        default: "0"
      max_instances:
        description: "Maximum container instances"
        required: false
        type: string
        default: "10"
      allow_unauthenticated:
        description: "Allow public invocations"
        required: false
        type: boolean
        default: true
      execution_environment:
        description: "Cloud Run execution environment"
        required: false
        type: string
        default: "gen2"
      service_account:
        description: "Runtime Service Account email"
        required: false
        type: string
        default: ""
      env_vars:
        description: "Environment variables (multiline KEY=VALUE)"
        required: false
        type: string
        default: ""
      secrets:
        description: "Secrets from Secret Manager (multiline ENV_VAR=SECRET_NAME:VERSION)"
        required: false
        type: string
        default: ""
      checkout_repository:
        description: "External repository to checkout (e.g. supporterApp/events-service)"
        required: false
        type: string
        default: ""
      checkout_ref:
        description: "Git ref/branch to checkout"
        required: false
        type: string
        default: ""
      enable_scheduler:
        description: "Whether to configure a Cloud Scheduler job triggering this service"
        required: false
        type: boolean
        default: false
      scheduler_job_name:
        description: "Name for the Cloud Scheduler job"
        required: false
        type: string
        default: ""
      scheduler_cron:
        description: "Cron schedule for Cloud Scheduler (e.g. '0 1 * * *')"
        required: false
        type: string
        default: ""
      scheduler_location:
        description: "Cloud Scheduler location"
        required: false
        type: string
        default: "europe-west1"
      scheduler_endpoint_path:
        description: "Endpoint path to invoke on the service (e.g. /ingest/weekly)"
        required: false
        type: string
        default: "/"
      scheduler_http_method:
        description: "HTTP method for scheduler invocation"
        required: false
        type: string
        default: "POST"
      scheduler_headers:
        description: "Headers to pass in scheduler request (e.g. apikey=xxx)"
        required: false
        type: string
        default: ""
      scheduler_oauth_service_account:
        description: "Service account for OAuth token in scheduler request"
        required: false
        type: string
        default: ""
    secrets:
      GCP_SA_KEY:
        required: true
      APP_ID:
        required: false
      APP_PRIVATE_KEY:
        required: false
    outputs:
      service_url:
        description: "Public URL of deployed Cloud Run service"
        value: ${{ jobs.deploy-service.outputs.service_url }}
      image_uri:
        description: "Container image URI"
        value: ${{ jobs.deploy-service.outputs.image_uri }}

jobs:
  deploy-service:
    runs-on: ubuntu-latest
    outputs:
      service_url: ${{ steps.deploy.outputs.service_url }}
      image_uri: ${{ steps.resolve-image.outputs.image_uri }}
    steps:
      - name: Check GitHub App secrets
        id: check-app-secrets
        if: ${{ inputs.checkout_repository != '' }}
        shell: bash
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi
        env:
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Authenticate GitHub App (if required)
        if: ${{ steps.check-app-secrets.outputs.available == 'true' }}
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ env.GITHUB_REPOSITORY_OWNER }}

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.checkout_repository != '' && inputs.checkout_repository || github.repository }}
          ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || github.ref }}
          token: ${{ steps.app-token.outputs.token != '' && steps.app-token.outputs.token || github.token }}

      - name: Checkout Deployment Actions (for external callers)
        if: ${{ inputs.checkout_repository != '' }}
        uses: actions/checkout@v4
        with:
          repository: cafaray/gcp-cloud-run-deployment
          path: .deploy-actions-temp

      - name: Sync Actions to Workspace (for external callers)
        if: ${{ inputs.checkout_repository != '' }}
        shell: bash
        run: |
          mkdir -p .github/actions
          cp -r .deploy-actions-temp/.github/actions/* .github/actions/
          rm -rf .deploy-actions-temp

      - name: Authenticate to Google Cloud
        uses: ./.github/actions/gcp-auth
        with:
          project_id: ${{ inputs.project_id }}
          region: ${{ inputs.region }}
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Resolve Image Name & Tag
        id: resolve-image
        shell: bash
        run: |
          IMG_NAME="${{ inputs.image_name }}"
          if [ -z "$IMG_NAME" ]; then
            IMG_NAME="${{ inputs.region }}-docker.pkg.dev/${{ inputs.project_id }}/${{ inputs.repository }}/${{ inputs.service_name }}"
          fi
          
          IMG_TAG="${{ inputs.image_tag }}"
          if [ -z "$IMG_TAG" ]; then
            IMG_TAG="${{ github.sha }}"
          fi

          echo "image_name=${IMG_NAME}" >> $GITHUB_OUTPUT
          echo "image_tag=${IMG_TAG}" >> $GITHUB_OUTPUT
          echo "image_uri=${IMG_NAME}:${IMG_TAG}" >> $GITHUB_OUTPUT

      - name: Build & Push Container Image
        if: ${{ inputs.skip_build == false }}
        uses: ./.github/actions/build-image
        with:
          image_name: ${{ steps.resolve-image.outputs.image_name }}
          image_tag: ${{ steps.resolve-image.outputs.image_tag }}
          context: ${{ inputs.context }}
          dockerfile: ${{ inputs.dockerfile }}
          build_args: ${{ inputs.build_args }}
          push_latest: "true"

      - name: Deploy Cloud Run Service
        id: deploy
        uses: ./.github/actions/deploy-cloud-run-service
        with:
          service_name: ${{ inputs.service_name }}
          image: ${{ steps.resolve-image.outputs.image_uri }}
          project_id: ${{ inputs.project_id }}
          region: ${{ inputs.region }}
          cpu: ${{ inputs.cpu }}
          memory: ${{ inputs.memory }}
          port: ${{ inputs.port }}
          timeout: ${{ inputs.timeout }}
          min_instances: ${{ inputs.min_instances }}
          max_instances: ${{ inputs.max_instances }}
          allow_unauthenticated: ${{ inputs.allow_unauthenticated }}
          execution_environment: ${{ inputs.execution_environment }}
          service_account: ${{ inputs.service_account }}
          env_vars: ${{ inputs.env_vars }}
          secrets: ${{ inputs.secrets }}

      - name: Configure Cloud Scheduler (Optional)
        if: ${{ inputs.enable_scheduler == true }}
        uses: ./.github/actions/setup-cloud-scheduler
        with:
          scheduler_job_name: ${{ inputs.scheduler_job_name != '' && inputs.scheduler_job_name || format('{0}-scheduler', inputs.service_name) }}
          schedule: ${{ inputs.scheduler_cron }}
          project_id: ${{ inputs.project_id }}
          location: ${{ inputs.scheduler_location }}
          target_type: "http"
          target_uri: "${{ steps.deploy.outputs.service_url }}${{ inputs.scheduler_endpoint_path }}"
          http_method: ${{ inputs.scheduler_http_method }}
          headers: ${{ inputs.scheduler_headers }}
          oauth_service_account_email: ${{ inputs.scheduler_oauth_service_account }}
